<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Compass - Simple Planner</title>
    <link href="./style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <main class="container mx-auto p-4 md:p-8 max-w-2xl">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold tracking-tight text-blue-600 mb-2 flex items-center justify-center gap-2">
                 <i class="fas fa-compass text-green-500"></i> Day Compass
            </h1>
            <p class="text-lg text-gray-600">Your simple daily planner.</p>
        </header>

        <section class="mb-8 card">
            <h2 class="text-xl font-semibold tracking-tight text-blue-600 mb-4">Add New Task</h2>
            <form id="task-form" class="space-y-4">
                <div>
                    <label for="task-description" class="block text-sm font-medium mb-1 text-gray-700">Task Description</label>
                    <input type="text" id="task-description" name="description" placeholder="e.g., Finish project proposal" class="input" required>
                </div>
                <div>
                     <label for="task-deadline" class="block text-sm font-medium mb-1 text-gray-700">Deadline (Optional)</label>
                     <input type="date" id="task-deadline" name="deadline" class="input w-auto">
                </div>
                <button type="submit" class="btn btn-accent">
                    <i class="fas fa-plus-circle mr-2"></i> Add Task
                </button>
            </form>
        </section>

        <section class="card">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold tracking-tight text-blue-600 flex items-center gap-2">
                   <i class="fas fa-list-ol"></i> Your Tasks
                </h2>
                <button id="optimize-button" class="btn btn-primary" disabled>
                     <i class="fas fa-lightbulb mr-2"></i> Optimize Schedule
                </button>
            </div>
             <hr class="border-gray-200 mb-4">
            <div id="task-list-container">
                <ul id="task-list" class="space-y-4">
                     <p id="no-tasks-message" class="text-center text-gray-500 mt-4">No tasks yet. Add some tasks to get started!</p>
                </ul>
                 <div id="loading-spinner" class="hidden text-center mt-4">
                     <i class="fas fa-spinner fa-spin text-blue-600 text-2xl"></i>
                     <p class="text-gray-500">Optimizing...</p>
                 </div>
            </div>
        </section>

         <footer class="mt-12 text-center text-sm text-gray-500">
             Simplified version built with HTML, Tailwind CSS, and Vanilla JS.
         </footer>

    </main>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <script src="../src/script.js"></script>
</body>
</html>
